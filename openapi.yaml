components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: 'Session-token auth per API Architecture §2. Server-issued opaque random tokens after credential exchange.
        256-bit random, base64url-encoded, stored hashed in the sessions table. Client does NOT parse them. Send `Authorization:
        Bearer <token>`. 401 = missing/expired/revoked. 403 = authenticated but missing capability.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opaque client key (UUID recommended) for safe retries. Same key + same body returns the original response;
        different body returns 409 `idempotency_violation`.
      schema:
        type: string
        format: uuid
        maxLength: 100
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Required. See `IdempotencyKey`.
      schema:
        type: string
        format: uuid
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag for optimistic concurrency. Resource ETag is the quoted `updated_at` (ISO 8601). Mismatch returns
        412 `version_mismatch`.
      schema:
        type: string
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Required for lifecycle actions. See `IfMatch`.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number.
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description: Page size. Hard cap 500.
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated list. Prefix `-` for descending.
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Case-insensitive substring search.
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: ISO 8601 lower bound.
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: ISO 8601 upper bound.
    Period:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum:
        - today
        - this_week
        - this_month
        - this_year
        - custom
      description: Convenience period alias.
    CompareTo:
      name: compare_to
      in: query
      required: false
      schema:
        type: string
      description: 'Period to compare against: `period` alias or `from,to`.'
    Include:
      name: include
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated sub-resources to embed (e.g., `lines,payments,returns`).
  responses:
    BadRequest:
      description: Validation failure (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, or expired credentials (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but missing required capability (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizationErrorEnvelope'
    NotFound:
      description: Resource not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictErrorEnvelope'
    PreconditionFailed:
      description: If-Match ETag mismatch (412).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Semantic conflict (422).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate-limited (429).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Server-side error (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Maintenance or transient (503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      description: Canonical error envelope. Used for all 4xx/5xx responses.
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              description: Stable, machine-readable snake_case code.
              example: not_found
            message:
              type: string
              description: Human-readable English.
            details:
              description: Optional, code-specific structure.
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
              - type: 'null'
            request_id:
              type: string
              format: uuid
              description: Echoes `X-Request-ID` header.
    ValidationErrorEnvelope:
      allOf:
      - $ref: '#/components/schemas/ErrorEnvelope'
      - type: object
        description: Returned for `validation_failed` (400).
        properties:
          error:
            type: object
            properties:
              code:
                const: validation_failed
              details:
                type: array
                items:
                  type: object
                  required:
                  - field
                  - code
                  - message
                  properties:
                    field:
                      type: string
                    code:
                      type: string
                    message:
                      type: string
    AuthorizationErrorEnvelope:
      allOf:
      - $ref: '#/components/schemas/ErrorEnvelope'
      - type: object
        description: Returned for `capability_required` (403).
        properties:
          error:
            type: object
            properties:
              code:
                const: capability_required
              details:
                type: object
                properties:
                  required:
                    type: array
                    items:
                      type: string
                    example:
                    - sale.cancel
    ConflictErrorEnvelope:
      allOf:
      - $ref: '#/components/schemas/ErrorEnvelope'
      - type: object
        description: Returned for state conflicts (409).
        properties:
          error:
            type: object
            properties:
              code:
                type: string
                enum:
                - insufficient_stock
                - negative_stock_disallowed
                - payment_exceeds_total
                - allocation_exceeds_payable
                - refund_exceeds_crl
                - repayment_exceeds_srec
                - cash_insufficient
                - return_quantity_exceeds_original
                - purchase_return_quantity_exceeds_original
                - lifecycle_state_invalid
                - already_cancelled
                - cannot_cancel_after_return
                - production_inputs_exceed_stock
                - production_finished_cost_invalid
                - cost_type_deactivated
                - product_deactivated
                - concurrent_modification
                - serialization_failure
                - idempotency_violation
                - delete_not_permitted
                - referenced_by_history
                - version_mismatch
              details:
                type: object
                additionalProperties: true
    Pagination:
      type: object
      required:
      - page
      - per_page
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 500
          example: 50
        total:
          type: integer
          minimum: 0
          example: 1234
        total_pages:
          type: integer
          minimum: 0
          example: 25
    Links:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        next:
          type:
          - string
          - 'null'
          format: uri-reference
        prev:
          type:
          - string
          - 'null'
          format: uri-reference
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      - refresh_expires_in
      - user
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/SessionUser'
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    SessionUser:
      type: object
      required:
      - id
      - username
      - full_name
      - role_id
      - role_name
      - capabilities
      properties:
        id:
          type: integer
          minimum: 1
        username:
          type: string
        full_name:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        is_active:
          type: boolean
        role_id:
          type: integer
          minimum: 1
        role_name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
    Role:
      type: object
      required:
      - id
      - name
      - is_system_role
      - is_active
      - created_at
      - updated_at
      - version
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type:
          - string
          - 'null'
        is_system_role:
          type: boolean
        is_active:
          type: boolean
        capability_codes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    RoleCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[A-Za-z0-9_ \-]+$
        description:
          type: string
          maxLength: 500
    RoleUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 500
    RoleCapabilitiesRequest:
      type: object
      required:
      - capability_codes
      properties:
        capability_codes:
          type: array
          items:
            type: string
    Capability:
      type: object
      required:
      - id
      - code
      - domain
      - default_owner
      - default_staff
      properties:
        id:
          type: integer
          minimum: 1
        code:
          type: string
        domain:
          type: string
        description:
          type:
          - string
          - 'null'
        default_owner:
          type: boolean
        default_staff:
          type: boolean
    User:
      type: object
      required:
      - id
      - username
      - full_name
      - is_active
      - role_id
      - role_name
      - created_at
      - updated_at
      - version
      properties:
        id:
          type: integer
          minimum: 1
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9._-]+$
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 150
        is_active:
          type: boolean
        role_id:
          type: integer
          minimum: 1
        role_name:
          type: string
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    UserCreateRequest:
      type: object
      required:
      - username
      - full_name
      - password
      - role_id
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9._-]+$
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          minLength: 8
          maxLength: 256
        role_id:
          type: integer
          minimum: 1
    UserUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        is_active:
          type: boolean
        role_id:
          type: integer
          minimum: 1
    PasswordResetRequest:
      type: object
      required:
      - new_password
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 256
    UserCapabilityOverrideRequest:
      type: object
      required:
      - capability_code
      - is_granted
      properties:
        capability_code:
          type: string
        is_granted:
          type: boolean
    UserEffectiveCapabilities:
      type: object
