openapi: 3.1.0
info:
  title: Business Management & POS System API
  version: 1.0.0
  summary: REST + JSON contract for the single-business web-based POS and operations platform.
  description: Authoritative machine-readable contract derived from API-Architecture-V1.0.md. Server is the only authority
    for business rules, accounting, and inventory. All derived balances (COGS, payment_state, AR/AP/CRL/SRec, cash_balance,
    inventory_value, moving_average_unit_cost, on_hand_quantity) are server-computed. Posted records are immutable; corrections
    go through lifecycle actions (cancel, return, refund). Cancellation, return, and refund are distinct events. All amounts
    use NUMERIC(15,2); quantities NUMERIC(15,4). Single currency (IDR). All timestamps are ISO 8601 with offset; server normalizes
    to UTC. Session-based auth (Bearer opaque tokens) per §2 of the API Architecture.
  contact:
    name: Business POS System API Team
  license:
    name: Proprietary
servers:
- url: https://api.example.com/api/v1
  description: Production
- url: https://staging-api.example.com/api/v1
  description: Staging
- url: http://localhost:8000/api/v1
  description: Local development
tags:
- name: Auth
  description: Login, refresh, logout, current session.
- name: System
  description: Health, version, server info.
- name: Users
  description: User accounts, password reset, unlock, capability grants.
- name: Roles
  description: Role management and capability assignment.
- name: Capabilities
  description: Canonical capability catalog (read-only).
- name: Audit
  description: Append-only audit log (read-only).
- name: Categories
  description: Product categories (master data).
- name: Units
  description: Units of measure (master data).
- name: Products
  description: Product master, price history, valuation.
- name: Contacts
  description: Customers and suppliers.
- name: Payment Methods
  description: Cash, bank transfer, e-wallet, other.
- name: Cost Types
  description: Production overhead cost types.
- name: Financial Categories
  description: Income and expense categories.
- name: Sales
  description: 'Sales/POS lifecycle: draft, post, pay, cancel, return.'
- name: Sale Lines
  description: Lines on a sale (sub-resource).
- name: Sale Payments
  description: Payment allocations on a sale (sub-resource).
- name: Sales Returns
  description: Physical goods returns against sales.
- name: Refunds
  description: Cash disbursements to customers (cash-out, never income).
- name: Purchases
  description: 'Purchase lifecycle: draft, receive, pay, cancel, return.'
- name: Purchase Lines
  description: Lines on a purchase (sub-resource).
- name: Purchase Payments
  description: Payment allocations on a purchase (sub-resource).
- name: Purchase Shipping
  description: Landed cost shipping on a purchase (sub-resource).
- name: Purchase Returns
  description: Physical goods returns to suppliers.
- name: Supplier Repayments
  description: Cash received from suppliers (clears Supplier Receivable).
- name: Inventory
  description: Stock movements, per-product stock summary, low-stock list.
- name: Stock Movements
  description: Immutable stock movement ledger (read-only).
- name: Production Runs
  description: Raw-to-finished production runs and cost lines.
- name: Production Inputs
  description: Raw materials consumed (sub-resource).
- name: Production Cost Lines
  description: Overhead costs (sub-resource).
- name: Manual Entries
  description: Manual income and expense entries.
- name: Cash Movements
  description: Immutable cash journal (read-only).
- name: Reports
  description: In-app reports.
- name: Dashboard
  description: Dashboard KPIs, trends, best-sellers, expense breakdown.
- name: Exports
  description: PDF/Excel export jobs.
- name: Notifications
  description: In-app notifications.
- name: Settings
  description: System configuration.
externalDocs:
  description: Authoritative narrative API Architecture
  url: ./API-Architecture-V1.0.md
paths:
  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate user, issue access + refresh tokens. Required `Idempotency-Key` (30s TTL) prevents replay.
      description: Authenticate user, issue access + refresh tokens. Required `Idempotency-Key` (30s TTL) prevents replay.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes: invalid_credentials / session_expired / session_revoked
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes: account_locked (5th attempt within 15 min)
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes: rate_limited
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-rate-limit: 5 per 15 min per IP; 10 per hour per user
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate access and refresh tokens. Old refresh is invalidated.
      description: Rotate access and refresh tokens. Old refresh is invalidated.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes: invalid_credentials / session_expired / session_revoked
  /auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke the current session.
      description: Revoke the current session.
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout-all:
    post:
      operationId: logoutAllSessions
      summary: Revoke all sessions for the current user.
      description: Revoke all sessions for the current user.
      tags:
      - Auth
      security:
      - bearerAuth: []
      x-required-capability: user.manage
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
