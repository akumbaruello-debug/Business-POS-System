        type:
          type: string
          enum:
          - low_stock
          - out_of_stock
          - below_cost_sale
          - system
          - action_confirmation
        message:
          type: string
        related_entity_type:
          type:
          - string
          - 'null'
        related_entity_id:
          type:
          - integer
          - 'null'
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    SettingsMap:
      type: object
      description: Map of system setting key → value. `costing_method` is read-only in V1 (returns 400 on PATCH).
      additionalProperties:
        oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: object
          additionalProperties: true
      example:
        costing_method: moving_average
        default_negative_stock_allowed: false
    SettingsPatch:
      type: object
      description: Partial update. Each key is validated against the known set.
      additionalProperties:
        oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: object
          additionalProperties: true
    HealthResponse:
      type: object
      required:
      - status
      - server_time
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
        server_time:
          type: string
          format: date-time
    SystemVersionResponse:
      type: object
      required:
      - version
      - api_version
      - server_time
      properties:
        version:
          type: string
        api_version:
          type: string
          example: v1
        server_time:
          type: string
          format: date-time
    SystemInfoResponse:
      type: object
      required:
      - server_time
      properties:
        company_name:
          type:
          - string
          - 'null'
        company_address:
          type:
          - string
          - 'null'
        timezone:
          type: string
          example: Asia/Jakarta
        server_time:
          type: string
          format: date-time
    PeriodComparison:
      type: object
      properties:
        previous_period:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        delta:
          type: object
          additionalProperties:
            type: number
        delta_pct:
          type: object
          additionalProperties:
            type: number
    SalesReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            revenue:
              type: number
            cogs:
              type: number
            gross_profit:
              type: number
            sales_count:
              type: integer
            average_ticket:
              type: number
        comparison:
          $ref: '#/components/schemas/PeriodComparison'
    ProfitLossResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            revenue:
              type: number
            cogs:
              type: number
            gross_profit:
              type: number
            other_income:
              type: number
            operating_expenses:
              type: number
            net_profit:
              type: number
        comparison:
          $ref: '#/components/schemas/PeriodComparison'
    InventoryReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            total_inventory_value:
              type: number
            products_count:
              type: integer
            low_stock_count:
              type: integer
            out_of_stock_count:
              type: integer
    PurchasesReportResponse:
      type: object
      required:
      - data
      - pagination
      description: F.1 purchases report response. Extends the standard PagedResponse with an optional ``comparison`` block
        per D-7 (architecture §12.1 line 1092 lists purchases among the reports that support period comparison).
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'
        comparison:
          allOf:
          - $ref: '#/components/schemas/PeriodComparison'
          nullable: true
    DashboardResponse:
      type: object
      required:
      - kpis
      - as_of
      properties:
        kpis:
          type: object
          properties:
            total_sales:
              type: number
            total_purchases:
              type: number
            net_profit:
              type:
              - number
              - 'null'
            cash_on_hand:
              type:
              - number
              - 'null'
            inventory_value:
              type: number
            low_stock_count:
              type: integer
        charts:
          type: object
          properties:
            sales_trend:
              type: array
              items:
                type: object
                additionalProperties: true
            best_sellers:
              type: array
              items:
                type: object
                additionalProperties: true
            expense_breakdown:
              type: array
              items:
                type: object
                additionalProperties: true
        comparison:
          $ref: '#/components/schemas/PeriodComparison'
        as_of:
          type: string
          format: date-time
    ExportCreateRequest:
      type: object
      required:
      - report
      - format
      properties:
        report:
          type: string
          enum:
          - sales
          - purchases
          - inventory
          - inventory-movements
          - sales-returns
          - purchase-returns
          - production
          - manual-income
          - manual-expense
          - refunds
          - supplier-repayments
          - cash-flow
          - p-and-l
          - receivables
          - payables
          - supplier-receivables
          - customer-refund-liabilities
        format:
          type: string
          enum:
          - pdf
          - xlsx
        filters:
          type: object
          additionalProperties: true
    ExportJob:
      type: object
      required:
      - export_id
      - status
      - created_at
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - processing
          - complete
          - failed
        download_url:
          type:
          - string
          - 'null'
          format: uri
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    DeactivateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
    PagedResponse:
      type: object
      description: Generic paged response used for report endpoints. `data` shape is report-specific.
      required:
      - data
      - pagination
      properties:
        data:
          oneOf:
          - type: array
            items:
              type: object
              additionalProperties: true
          - type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
security:
- bearerAuth: []
